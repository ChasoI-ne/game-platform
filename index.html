<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0d12" />
    <title>ゲーム一覧 | INDIEPORT</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, -apple-system, "Segoe UI", "Hiragino Kaku Gothic ProN",
          "Noto Sans JP", sans-serif;
        background: #0b0d12;
        color: #e8eaf0;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        background:
          radial-gradient(900px 500px at 50% -10%, #2a1b4d 0%, transparent 70%),
          #0b0d12;
      }

      .wrap {
        width: min(1100px, 92vw);
        margin: 0 auto;
        padding: 72px 0 96px;
      }

      .kicker {
        margin: 0 0 12px;
        color: #a78bfa;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.18em;
      }

      h1 {
        margin: 0 0 12px;
        font-size: clamp(32px, 6vw, 52px);
        line-height: 1.1;
      }

      .lead {
        margin: 0 0 40px;
        color: #9ca3af;
      }

      code {
        padding: 2px 7px;
        border: 1px solid #2d3140;
        border-radius: 6px;
        background: #151823;
        color: #c4b5fd;
      }

      .status { color: #9ca3af; }
      .status.error { color: #fca5a5; }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
        gap: 20px;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .card {
        display: block;
        overflow: hidden;
        border: 1px solid #262a38;
        border-radius: 14px;
        background: #12151e;
        color: inherit;
        text-decoration: none;
        transition: transform 0.18s ease, border-color 0.18s ease;
      }

      .card:hover {
        transform: translateY(-4px);
        border-color: #7c3aed;
      }

      .media {
        display: grid;
        aspect-ratio: 16 / 10;
        place-items: center;
        background: linear-gradient(135deg, #1d1536, #111827);
        overflow: hidden;
      }

      .media img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .mark {
        color: #a78bfa;
        font-size: 48px;
        font-weight: 800;
      }

      .body { padding: 16px 18px 20px; }

      .body h2 {
        margin: 0 0 8px;
        font-size: 17px;
        overflow-wrap: anywhere;
      }

      .body p {
        margin: 0;
        color: #8b93a7;
        font-size: 13px;
      }

      .empty {
        padding: 40px;
        border: 1px dashed #2d3140;
        border-radius: 14px;
        color: #9ca3af;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <p class="kicker">INDIEPORT</p>
        <h1>ゲーム一覧</h1>
        <p class="lead">同じ階層の <code>games/</code> フォルダからゲームを読み込んでいます。</p>
      </header>

      <p id="status" class="status" role="status">読み込み中…</p>
      <ul id="game-list" class="grid"></ul>
    </div>

    <script type="module">
      const status = document.querySelector('#status')
      const list = document.querySelector('#game-list')

      try {
        const response = await fetch('./games.json', { cache: 'no-store' })
        if (!response.ok) throw new Error(`${response.status} ${response.statusText}`)

        const data = await response.json()
        const games = Array.isArray(data?.games) ? data.games : []

        status.remove()

        if (games.length === 0) {
          const empty = document.createElement('p')
          empty.className = 'empty'
          empty.textContent = 'games/ フォルダに index.html を持つゲームがありません。'
          list.replaceWith(empty)
        }

        for (const game of games) {
          const item = document.createElement('li')
          const link = document.createElement('a')
          link.className = 'card'
          link.href = game.url

          const media = document.createElement('div')
          media.className = 'media'

          if (game.thumbnail) {
            const img = document.createElement('img')
            img.src = game.thumbnail
            img.alt = ''
            img.loading = 'lazy'
            img.addEventListener('error', () => img.remove(), { once: true })
            media.appendChild(img)
          } else {
            const mark = document.createElement('span')
            mark.className = 'mark'
            mark.textContent = game.name.slice(0, 1).toUpperCase()
            media.appendChild(mark)
          }

          const body = document.createElement('div')
          body.className = 'body'
          const title = document.createElement('h2')
          title.textContent = game.name
          const hint = document.createElement('p')
          hint.textContent = 'ゲームを開く →'
          body.append(title, hint)

          link.append(media, body)
          item.appendChild(link)
          list.appendChild(item)
        }
      } catch (error) {
        status.textContent = `games.json を読み込めませんでした: ${error.message}`
        status.classList.add('error')
        console.error(error)
      }
    </script>
  </body>
</html>
