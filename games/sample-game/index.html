<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <title>サンプルゲーム | INDIEPORT</title>
    <style>
      :root {
        color-scheme: light;
        font-family: ui-sans-serif, system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-content: center;
        gap: 18px;
        text-align: center;
        padding: 32px;
        background: radial-gradient(700px 320px at 50% -80px, #ede9fe 0%, transparent 70%), #f8fafc;
        color: #0f172a;
      }
      h1 { margin: 0; font-size: clamp(28px, 6vw, 44px); }
      p { margin: 0; color: #64748b; }
      a {
        justify-self: center;
        margin-top: 8px;
        padding: 11px 20px;
        border-radius: 999px;
        background: #6d28d9;
        color: #fff;
        font-size: 14px;
        font-weight: 700;
        text-decoration: none;
      }
      a:hover { background: #5b21b6; }
    </style>
  </head>
  <body>
    <h1>サンプルゲーム</h1>
    <p>公開作品のサンプルです。自由に差し替えて使ってください。</p>
    <a href="../../index.html">← 作品一覧に戻る</a>
  </body>
</html>
